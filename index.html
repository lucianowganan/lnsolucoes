<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LN Soluções Empresariais · vagas CLT</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&amp;family=Hanken+Grotesk:wght@300..800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --floresta: #0E4937; --profundo: #062E22; --folha: #72BF00; --lima: #C6F963;
  --laranja: #FF5A1A; --queimado: #B93A0A; --papel: #F6F1E7; --preto: #0B0F0D;
  --surface: #F6F1E7; --raised: #FFFFFF; --ink: #0B0F0D; --muted: #5B6761;
  --brand: #0E4937; --on-brand: #FFFFFF; --accent: #C6F963; --on-accent: #0E4937;
  --line: #D9DED9; --grid: rgba(14, 73, 55, 0.09); --edge: #0E4937; --signal-text: #B93A0A;
  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-text: "Hanken Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #062E22; --raised: #0E4937; --ink: #F6F1E7; --muted: #D9DED9;
    --brand: #C6F963; --on-brand: #0E4937; --accent: #C6F963; --on-accent: #0E4937;
    --line: #2D5E4D; --grid: rgba(198, 249, 99, 0.07); --edge: #2D5E4D; --signal-text: #FF5A1A;
  }
}
:root[data-theme="dark"] {
  --surface: #062E22; --raised: #0E4937; --ink: #F6F1E7; --muted: #D9DED9;
  --brand: #C6F963; --on-brand: #0E4937; --accent: #C6F963; --on-accent: #0E4937;
  --line: #2D5E4D; --grid: rgba(198, 249, 99, 0.07); --edge: #2D5E4D; --signal-text: #FF5A1A;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-text); font-size: 18px; line-height: 1.5; padding-bottom: env(safe-area-inset-bottom, 0px); }
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.03em; line-height: 1; margin: 0; color: var(--brand); }
p { margin: 0; }
a { color: inherit; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--signal-text); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--brand); color: var(--on-brand); padding: 8px 16px; border-radius: 999px; z-index: 100; }
.skip:focus { left: 8px; }
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.gridbg { background-color: var(--surface); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 54px 54px; }

.topbar { background: var(--profundo); color: #D9DED9; font-size: 14px; padding: 8px 0; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
.topbar .wrap { display: flex; gap: 12px; align-items: center; justify-content: center; text-align: center; }
.site-head { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 2px solid var(--line); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 12px; padding-bottom: 12px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.chip { width: 48px; height: 48px; border-radius: 14px; background: var(--profundo); display: flex; align-items: center; justify-content: center; flex: none; }
.brand b { display: block; font-size: 17px; line-height: 1.1; }
.brand small { display: block; font-size: 13px; color: var(--muted); }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav a { text-decoration: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 16px; }
.nav a:hover { background: var(--line); }
.nav a.nav-ig { display: inline-flex; align-items: center; gap: 6px; border: 2px solid currentColor; margin-left: 6px; }
.nav a[aria-current="page"] { background: var(--brand); color: var(--on-brand); }
.menu-btn { display: none; }
@media (max-width: 860px) {
  .menu-btn { display: inline-flex; }
  .nav { display: none; }
  .nav.open { display: flex; position: fixed; inset: 0; z-index: 40; background: var(--surface); flex-direction: column; align-items: stretch; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top, 0px)); overflow-y: auto; }
  .nav a { padding: 16px 14px; font-size: 20px; }
  .nav .close-nav { align-self: flex-end; margin-bottom: 16px; }
}

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: 999px; font-weight: 700; border: 2px solid transparent; cursor: pointer; text-decoration: none; background: transparent; line-height: 1.2; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.ghost { border-color: var(--brand); color: var(--brand); }
.btn.small { padding: 9px 18px; font-size: 16px; }
.btn.warn { border-color: var(--signal-text); color: var(--signal-text); }
.btn.dark { background: var(--profundo); color: var(--lima); }
.btn:hover { filter: brightness(1.08); }
.pill { display: inline-block; padding: 5px 16px; border-radius: 999px; font-weight: 700; font-size: 15px; line-height: 1.3; }
.pill.acc { background: var(--lima); color: var(--floresta); }
.pill.out { border: 2px solid var(--brand); color: var(--brand); padding: 3px 14px; }
.pill.sig { background: var(--laranja); color: var(--preto); }
.pill.brand { background: var(--brand); color: var(--on-brand); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.muted { color: var(--muted); }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--laranja); color: var(--preto); font-size: 13px; font-weight: 700; vertical-align: middle; }

.hero { padding: 56px 0 64px; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.hero .lead { font-family: var(--font-display); font-weight: 300; font-size: clamp(30px, 5vw, 56px); letter-spacing: -0.04em; color: var(--brand); }
.hero h1 { font-size: clamp(64px, 9vw, 128px); font-weight: 800; letter-spacing: -0.045em; line-height: 0.86; }
.hero h1 .hl { display: inline-block; background: var(--lima); color: var(--floresta); border-radius: 999px; padding: 0 0.22em 0.08em; margin-top: 8px; }
.hero .sub { font-size: clamp(19px, 2.2vw, 24px); font-weight: 500; max-width: 30em; margin: 28px 0; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; }
.stack { position: relative; height: 330px; overflow: hidden; }
.fold { position: absolute; left: 0; right: 0; }
.fold .tb { position: absolute; top: 0; padding: 9px 20px; border-radius: 20px 20px 0 0; font-weight: 600; font-size: 16px; white-space: nowrap; }
.fold .bd { position: absolute; top: 34px; left: 0; right: 0; height: 600px; border-radius: 28px 28px 0 0; }
.f1 { top: 0; } .f1 .tb { left: 16px; background: var(--floresta); color: var(--lima); } .f1 .bd { background: var(--floresta); }
.f2 { top: 96px; } .f2 .tb { left: 90px; background: var(--lima); color: var(--floresta); } .f2 .bd { background: var(--lima); }
.f3 { top: 192px; } .f3 .tb { left: 164px; background: var(--laranja); color: var(--preto); } .f3 .bd { background: var(--laranja); }
@media (max-width: 860px) { .hero-grid { grid-template-columns: 1fr; } .stack { height: 250px; } .f2 { top: 76px; } .f3 { top: 152px; } }

section.blk { padding: 64px 0; }
.sec-title { font-size: clamp(38px, 6vw, 68px); font-weight: 800; margin-bottom: 32px; }
.sec-title small { display: block; font-weight: 300; font-size: 0.55em; margin-bottom: 6px; letter-spacing: -0.04em; }
.page-head { padding: 48px 0 40px; }
.page-head p.intro { max-width: 36em; font-size: 20px; font-weight: 500; margin-top: 16px; }

.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 28px 24px; }
.vcard { display: flex; flex-direction: column; }
.vtab { align-self: flex-start; margin-left: 22px; padding: 8px 18px; border-radius: 20px 20px 0 0; background: var(--floresta); color: var(--lima); font-weight: 600; font-size: 15px; }
.vbody { background: var(--raised); border: 2px solid var(--edge); border-radius: 0 26px 26px 26px; padding: 24px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.vbody h3 { font-size: 32px; font-weight: 800; }
.vcode { font-size: 14px; color: var(--muted); font-weight: 600; }
.vfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 16px; }
@media (max-width: 980px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
.step .tb { display: inline-block; padding: 8px 18px; border-radius: 20px 20px 0 0; font-weight: 600; font-size: 15px; margin-left: 18px; }
.step .bd { border-radius: 0 26px 26px 26px; padding: 22px; min-height: 200px; display: flex; flex-direction: column; gap: 10px; }
.step h3 { font-size: 30px; font-weight: 800; color: inherit; }
.step p { font-weight: 500; font-size: 17px; }
.s1 .tb, .s1 .bd { background: var(--floresta); color: var(--lima); }
.s2 .tb, .s2 .bd { background: var(--lima); color: var(--floresta); }
.s3 .tb, .s3 .bd { background: var(--folha); color: var(--preto); }
.s4 .tb, .s4 .bd { background: var(--laranja); color: var(--preto); }

.band { border-radius: 36px; padding: clamp(28px, 5vw, 56px); display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.band.folha { background: var(--folha); color: var(--preto); }
.band.folha h2 { color: var(--profundo); }
.band.lima { background: var(--lima); color: var(--preto); }
.band.lima h2 { color: var(--floresta); }
.band h2 { font-size: clamp(34px, 5vw, 56px); font-weight: 800; }
.band p { font-size: 20px; font-weight: 500; margin-top: 14px; }
.band .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-start; }
.band .btn.primary { background: var(--profundo); color: var(--lima); }
.band .btn.ghost { border-color: var(--profundo); color: var(--profundo); }
@media (max-width: 760px) { .band { grid-template-columns: 1fr; } }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 28px; }
.chipf { border: 2px solid var(--brand); color: var(--brand); background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 15px; cursor: pointer; }
.chipf[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.search { flex: 1 1 220px; max-width: 340px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--raised); }
.empty { border: 2px dashed var(--brand); border-radius: 28px; padding: 40px 28px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty h3 { font-size: 34px; }

.jobpage .folderwrap { background: var(--floresta); border-radius: 36px; padding: clamp(18px, 4vw, 40px); }
.jobtab { display: inline-block; vertical-align: bottom; line-height: 1; padding: 11px 22px 13px; border-radius: 22px 22px 0 0; background: var(--floresta); color: var(--lima); font-weight: 600; margin: 0 0 -2px 24px; }
.sheet { background: #FFFFFF; color: #0B0F0D; border-radius: 24px; padding: clamp(22px, 4vw, 44px); display: grid; gap: 26px; }
.sheet h1 { font-size: clamp(44px, 8vw, 92px); font-weight: 800; color: #0E4937; }
.sheet h4 { font-size: 17px; font-weight: 700; color: #5B6761; letter-spacing: 0; margin-bottom: 10px; font-family: var(--font-text); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.checks svg { flex: none; margin-top: 3px; }
.sheet .pill.out { border-color: #0E4937; color: #0E4937; }
.apply { margin-top: 24px; border-radius: 28px; background: var(--profundo); color: #F6F1E7; padding: clamp(22px, 4vw, 36px); display: grid; gap: 14px; }
.apply h2 { color: #F6F1E7; font-size: clamp(30px, 5vw, 46px); font-weight: 800; }
.apply .btn.primary { background: var(--lima); color: var(--floresta); }
.apply .btn.ghost { border-color: var(--lima); color: var(--lima); }
.banner { border-radius: 20px; padding: 16px 20px; font-weight: 600; margin-bottom: 20px; }
.banner.warn { background: var(--laranja); color: var(--preto); }
.banner.info { background: var(--lima); color: var(--floresta); }
.back { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; text-decoration: none; margin-bottom: 20px; color: var(--brand); }

.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: start; }
@media (max-width: 900px) { .twocol { grid-template-columns: 1fr; } }
.card { background: var(--raised); border: 2px solid var(--edge); border-radius: 28px; padding: clamp(22px, 4vw, 36px); }
.form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; }
.field label, .field .lab { font-weight: 700; font-size: 16px; }
.field input[type="text"], .field input[type="email"], .field input[type="tel"], .field input[type="password"], .field input[type="search"], .field select, .field textarea { width: 100%; padding: 12px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); }
.field textarea { min-height: 96px; resize: vertical; }
.field .hint { font-size: 14px; color: var(--muted); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); outline: none; }
.err { color: var(--signal-text); font-weight: 700; font-size: 15px; }
.checkrow { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.checkrow input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--brand); flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--brand); font-weight: 600; font-size: 15px; cursor: pointer; }
.chips input { accent-color: var(--brand); }
.hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
.list { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.notlist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.notlist li { display: flex; gap: 10px; }

details.acc { background: var(--raised); border: 2px solid var(--edge); border-radius: 24px; padding: 4px 24px; margin-bottom: 14px; }
details.acc summary { cursor: pointer; list-style: none; padding: 18px 0; font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--brand); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; font-size: 32px; line-height: 1; }
details.acc[open] summary::after { content: "–"; }
details.acc .in { padding: 0 0 22px; display: grid; gap: 14px; max-width: 46em; }
details.acc h4 { font-family: var(--font-text); font-size: 17px; letter-spacing: 0; color: var(--ink); }

.result { border-radius: 28px; padding: 28px; display: grid; gap: 12px; margin-top: 24px; }
.result.ok { background: var(--lima); color: var(--floresta); }
.result.end { background: var(--folha); color: var(--preto); }
.result.no { background: var(--laranja); color: var(--preto); }
.result h2 { font-size: 40px; color: inherit; }

footer.site-foot { background: var(--profundo); color: #F6F1E7; padding: 48px 0 56px; margin-top: 40px; }
footer .fgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr)); gap: 32px; }
@media (max-width: 760px) { footer .fgrid { grid-template-columns: 1fr; } }
footer h4 { color: var(--lima); font-size: 22px; margin-bottom: 12px; }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
footer a { color: #F6F1E7; }
footer .small { font-size: 14px; color: #D9DED9; margin-top: 24px; }
footer .btn { border-color: #F6F1E7; color: #F6F1E7; }

.adm-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 28px; }
.adm-nav a { text-decoration: none; padding: 9px 18px; border-radius: 999px; border: 2px solid var(--brand); font-weight: 700; color: var(--brand); }
.adm-nav a[aria-current="page"] { background: var(--brand); color: var(--on-brand); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 32px; }
.stat { background: var(--raised); border: 2px solid var(--edge); border-radius: 24px; padding: 20px; }
.stat b { display: block; font-family: var(--font-display); font-size: 52px; line-height: 1; color: var(--brand); letter-spacing: -0.04em; }
.tablewrap { overflow-x: auto; border: 2px solid var(--edge); border-radius: 24px; background: var(--raised); }
table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 16px; }
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 700; color: var(--muted); font-size: 15px; }
tr:last-child td { border-bottom: 0; }
td select { padding: 6px 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); }
.rowbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.phases { display: grid; gap: 12px; margin-top: 12px; }
.phase { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; border-radius: 20px; border: 2px solid var(--line); background: var(--raised); }
.phase b { display: block; }
.editor { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 980px) { .editor { grid-template-columns: 1fr; } }
.sticky { position: sticky; top: 96px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--profundo); color: var(--lima); padding: 14px 24px; border-radius: 999px; font-weight: 700; z-index: 60; box-shadow: none; border: 2px solid var(--lima); }
.overlay { position: fixed; inset: 0; background: rgba(6, 46, 34, 0.86); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--surface); border-radius: 28px; padding: 28px; width: min(720px, 100%); display: grid; gap: 14px; }
.modal textarea { width: 100%; min-height: 220px; border-radius: 16px; border: 2px solid var(--line); padding: 12px; background: var(--raised); font-family: ui-monospace, monospace; font-size: 14px; }
.login { max-width: 460px; margin: 56px auto; }
.linklike { background: none; border: none; padding: 0; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }

/* revelar ao rolar a página */
:is(.hero .lead, .hero h1, .hero .sub, .hero .cta-row, .stack .fold, .vgrid > *, .steps > *, .band, .card, .sheet, .apply, details.acc, .phase, .page-head h1, .page-head p.intro) {
  opacity: 0; transform: translateY(26px);
  transition: opacity .65s cubic-bezier(.16,.84,.44,1), transform .65s cubic-bezier(.16,.84,.44,1);
}
:is(.hero .lead, .hero h1, .hero .sub, .hero .cta-row, .stack .fold, .vgrid > *, .steps > *, .band, .card, .sheet, .apply, details.acc, .phase, .page-head h1, .page-head p.intro).reveal-in {
  opacity: 1; transform: none;
}
.stack .fold:nth-child(2) { transition-delay: .06s; } .stack .fold:nth-child(3) { transition-delay: .12s; }
.vgrid > *:nth-child(2), .steps > *:nth-child(2) { transition-delay: .06s; }
.vgrid > *:nth-child(3), .steps > *:nth-child(3) { transition-delay: .12s; }
.vgrid > *:nth-child(4), .steps > *:nth-child(4) { transition-delay: .18s; }

/* botões: preenchem com cor de contraste ao passar o mouse, em vez de só subir */
.btn { position: relative; isolation: isolate; overflow: hidden; transition: color .3s ease, border-color .3s ease, transform .15s ease; }
.btn::after { content: ""; position: absolute; inset: 0; z-index: -1; transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.65,0,.35,1); }
.btn:hover::after { transform: scaleX(1); }
.btn.primary::after, .btn.dark::after { background: var(--lima); }
.btn.primary:hover, .btn.dark:hover { color: var(--floresta); }
.btn.ghost::after { background: var(--brand); }
.btn.ghost:hover { color: var(--on-brand); }
.btn.warn::after { background: var(--signal-text); }
.btn.warn:hover { color: #FFFFFF; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.vcard { transition: transform .2s ease, box-shadow .2s ease; }
.vcard:hover { transform: translateY(-4px); }
.chipf { transition: transform .15s ease, background-color .2s ease, color .2s ease; }
.chipf:hover { transform: translateY(-1px); }
.fold .bd { transition: transform .25s ease; }
.stack:hover .f1 .bd { transform: translateY(-4px); }
.stack:hover .f2 .bd { transform: translateY(-2px); }
#nav a { transition: background-color .2s ease; }

<body>

<div id="app"></div>
<script>
(function () {
  'use strict';
  var MAIL = 'contato@lnsolucoesempresariais.com.br';
  var IG = '@ln.solucoesempresariais';
  var CNPJ = '68.378.072/0001-00';
  var SEGS = ['Farmácia de manipulação', 'Indústria de suplementos', 'Supermercado', 'Loja de roupa feminina', 'Restaurante', 'Outro segmento'];
  var AREAS = ['Atendimento', 'Comercial', 'Administrativo', 'Recepção', 'Estoque e logística', 'Laboratório', 'Outra área'];
  var K = { v: 'ln_site_vagas_v1', t: 'ln_site_talentos_v1', c: 'ln_site_config_v1', a: 'ln_site_auth_v1' };
  var PL = 'M156,130 H296 A20,20 0 0 1 316,150 V646 H586 A20,20 0 0 1 606,666 V806 A20,20 0 0 1 586,826 H336 V701 A75,75 0 0 0 261,626 H136 V150 A20,20 0 0 1 156,130 Z';
  var PN = 'M432,150 A20,20 0 0 1 452,130 L585.93,130 A14,14 0 0 1 597.91,136.74 L812,490 L812,150 A20,20 0 0 1 832,130 L965,130 A20,20 0 0 1 985,150 L985,806 A20,20 0 0 1 965,826 L836.9,826 A20,20 0 0 1 819.8,816.37 L606,463.6 L606,606 A20,20 0 0 1 586,626 L452,626 A20,20 0 0 1 432,606 Z';
  var PB = 'M136,660 A14,14 0 0 1 150,646 H261 A55,55 0 0 1 316,701 V826 H206 A70,70 0 0 1 136,756 Z';
  var ICONS = {
    seta: 'M4 12h16M14 6l6 6-6 6', voltar: 'M20 12H4M10 6l-6 6 6 6', check: 'M5 12.5l4.5 4.5L19 7.5',
    envelope: 'M3 6h18v12H3zM3 7l9 7 9-7', escudo: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5',
    alerta: 'M12 3l10 17H2zM12 9v5M12 17.5v.5', x: 'M6 6l12 12M18 6L6 18'
  };
  function ic(n, s, col) {
    return '<svg aria-hidden="true" width="' + (s || 22) + '" height="' + (s || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (col || 'currentColor') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICONS[n] + '"/></svg>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function normCode(s) { return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function fmtDate(iso) { if (!iso) return ''; var d = new Date(String(iso).length <= 10 ? iso + 'T12:00:00' : iso); return isNaN(d) ? '' : d.toLocaleDateString('pt-BR'); }

  // store local só para a configuração (mostrar local/salário), que não fica no banco
  var store = {
    get: function (k, def) { try { var s = localStorage.getItem(k); if (s) return JSON.parse(s); } catch (e) {} return def; },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- Supabase ----------
  var SUPABASE_URL = 'https://tjmopmvvgtuhkfivzzra.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_iJg09uu0miSxj_821jZeOw_bV3gAKYa';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var cfg = Object.assign({ showLocal: false, showSalary: false }, store.get(K.c, {}) || {});
  function saveCfg() { store.set(K.c, cfg); }
  var vagas = [];
  var talentos = [];
  var posts = [];
  var authed = false;
  var ui = { confirm: null, flash: null, vagaDraft: null, filterSeg: '', q: '', tq: '', loading: true, loadError: null };

  function mapVaga(r) {
    return { id: r.id, codigo: r.codigo, titulo: r.titulo, segmento: r.segmento, modalidade: r.modalidade,
      horarios: r.horarios || [], atividades: r.atividades || [], requisitos: r.requisitos || [],
      local: r.local || '', salario: r.salario || '', status: r.status, criada: r.criada_em, atualizada: r.atualizada_em };
  }
  function mapTalento(r) {
    return { id: r.id, nome: r.nome, email: r.email, telefone: r.telefone, cidade: r.cidade, areas: r.areas || [],
      mensagem: r.mensagem || '', cv: r.cv_nome || '', consent: r.consentimento, criado: r.criado_em };
  }

  async function refreshVagas() {
    var q = sb.from('vagas').select('*').order('criada_em', { ascending: false });
    var res = await q;
    if (res.error) { ui.loadError = res.error.message; vagas = []; return; }
    vagas = (res.data || []).map(mapVaga);
  }
  async function refreshTalentos() {
    if (!authed) { talentos = []; return; }
    var res = await sb.from('talentos').select('*').order('criado_em', { ascending: false });
    if (res.error) { talentos = []; return; }
    talentos = (res.data || []).map(mapTalento);
  }
  function mapPost(r) {
    return { id: r.id, slug: r.slug, titulo: r.titulo, resumo: r.resumo || '', conteudo: r.conteudo || '',
      status: r.status, criada: r.criada_em, atualizada: r.atualizada_em, publicada: r.publicada_em };
  }
  async function refreshPosts() {
    var res = await sb.from('posts').select('*').order('criada_em', { ascending: false });
    if (res.error) { posts = []; return; }
    posts = (res.data || []).map(mapPost);
  }
  function findPost(slug) { return posts.filter(function (p) { return p.slug === slug; })[0]; }
  function postsPublicados() { return posts.filter(function (p) { return p.status === 'publicado'; }); }
  function slugify(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
  }
  async function refreshAuth() {
    var res = await sb.auth.getSession();
    authed = !!(res.data && res.data.session);
  }
  async function boot() {
    ui.loading = true;
    await refreshAuth();
    await refreshVagas();
    await refreshPosts();
    if (authed) await refreshTalentos();
    ui.loading = false;
    render();
  }
  function findVaga(code) { var n = normCode(code); return vagas.filter(function (v) { return normCode(v.codigo) === n; })[0]; }
  function nextCode() { var n = 0; vagas.forEach(function (v) { var m = /(\d+)$/.exec(v.codigo); if (m) n = Math.max(n, +m[1]); }); return 'LN-' + String(n + 1).padStart(3, '0'); }
  function publicas() { return vagas.filter(function (v) { return v.status === 'publicada'; }); }

  /* ---------- pedaços de interface ---------- */
  function logoChip() {
    return '<span class="chip"><svg viewBox="136 130 849 696" width="32" height="26" role="img" aria-label="LN"><path fill="#F6F1E7" d="' + PL + '"/><path fill="#F6F1E7" d="' + PN + '"/><path fill="#C6F963" d="' + PB + '"/></svg></span>';
  }
  function topbar() { return ''; }
  function navLink(href, label, active, key) { return '<a href="' + href + '"' + (active === key ? ' aria-current="page"' : '') + '>' + label + '</a>'; }
  var ICON_IG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';
  function header(active) {
    return '<header class="site-head"><div class="wrap"><a class="brand" href="#/" aria-label="LN Soluções Empresariais, início">' + logoChip() + '<span><b>Soluções Empresariais</b><small>' + IG + '</small></span></a>' +
      '<button class="btn ghost small menu-btn" data-a="menu" aria-expanded="false" aria-controls="nav">Menu</button>' +
      '<nav class="nav" id="nav" aria-label="Principal">' +
      '<button class="btn ghost small close-nav" type="button" data-a="menu">Fechar ✕</button>' +
      navLink('#/vagas', 'Vagas', active, 'vagas') + navLink('#/talentos', 'Banco de talentos', active, 'talentos') +
      navLink('#/dicas', 'Dicas', active, 'dicas') + navLink('#/blog', 'Blog', active, 'blog') + '<a href="/curriculo/">Gerador de currículo</a>' + navLink('#/sobre', 'Sobre a LN', active, 'sobre') + navLink('#/verificar', 'Verificar vaga', active, 'verificar') +
      '<a class="nav-ig" href="https://www.instagram.com/ln.solucoesempresariais/" target="_blank" rel="noopener" aria-label="Instagram da LN">' + ICON_IG + ' Instagram</a>' +
      '</nav></div></header>';
  }
  function footer() {
    return '<footer class="site-foot"><div class="wrap"><div class="fgrid">' +
      '<div><h4>LN Soluções Empresariais</h4><p>Terceirização de mão de obra em regime CLT. A LN contrata você e você trabalha na empresa cliente.</p></div>' +
      '<div><h4>Canais oficiais</h4><ul><li>Instagram: ' + IG + '</li><li>E-mail: <a href="mailto:' + MAIL + '">' + MAIL + '</a></li><li>CNPJ: ' + CNPJ + '</li></ul></div>' +
      '<div><h4>Links</h4><ul><li><a href="#/blog">Blog</a></li><li><a href="#/privacidade">Aviso de privacidade</a></li><li><a href="#/dicas">Dicas e perguntas frequentes</a></li></ul>' +
      '<p style="margin-top:16px"><button class="btn small" data-a="theme">Trocar tema claro e escuro</button></p></div>' +
      '</div><p class="small">A LN nunca pede pagamento, documento ou dado bancário para participar de um processo seletivo. Na dúvida, confira a vaga em <a href="#/verificar">Verificar vaga</a>.</p></div></footer>';
  }
  function shell(inner, active) { return topbar() + header(active) + '<main id="main" tabindex="-1">' + inner + '</main>' + footer(); }

  function vagaPills(v) {
    var s = '<span class="pill acc">CLT</span>';
    if (v.modalidade) s += '<span class="pill out">' + esc(v.modalidade) + '</span>';
    (v.horarios || []).slice(0, 2).forEach(function (h) { s += '<span class="pill out">' + esc(h) + '</span>'; });
    if (cfg.showLocal && v.local) s += '<span class="pill out">' + esc(v.local) + '</span>';
    if (cfg.showSalary && v.salario) s += '<span class="pill out">' + esc(v.salario) + '</span>';
    return s;
  }
  function vagaCard(v, preview) {
    var title = v.titulo || 'Título da vaga';
    return '<article class="vcard"><div class="vtab">' + esc(v.segmento || 'Segmento') + '</div><div class="vbody"><h3>' + esc(title) + '</h3><div class="pills">' + vagaPills(v) + '</div>' +
      '<div class="vfoot"><span class="vcode">Código ' + esc(v.codigo || 'LN-000') + '</span>' + (preview ? '' : '<a class="btn primary small" href="#/vaga/' + esc(v.codigo) + '">Ver vaga ' + ic('seta', 18) + '</a>') + '</div></div></article>';
  }
  function emptyVagas() {
    return '<div class="empty"><h3>Nenhuma vaga aberta agora</h3><p>Deixe seus dados no banco de talentos e a LN chama você quando abrir uma vaga compatível.</p><a class="btn primary" href="#/talentos">Entrar no banco de talentos</a></div>';
  }

  /* ---------- páginas públicas ---------- */
  function pHome() {
    var list = publicas().slice(0, 3);
    var cards = list.length ? '<div class="vgrid">' + list.map(function (v) { return vagaCard(v); }).join('') + '</div>' : emptyVagas();
    return '<section class="hero gridbg"><div class="wrap hero-grid"><div><p class="lead">confira as</p><h1>vagas<br><span class="hl">abertas</span></h1>' +
      '<p class="sub">Você é contratado pela LN, em regime CLT, e trabalha na empresa cliente. Cada pasta é um segmento: abra para ver a vaga.</p>' +
      '<div class="cta-row"><a class="btn primary" href="#/vagas">Ver vagas abertas</a><a class="btn ghost" href="#/talentos">Entrar no banco de talentos</a></div></div>' +
      '<div class="stack" aria-hidden="true"><div class="fold f1" data-animate><span class="tb">saúde</span><div class="bd"></div></div><div class="fold f2" data-animate><span class="tb">alimentação</span><div class="bd"></div></div><div class="fold f3" data-animate><span class="tb">administrativo</span><div class="bd"></div></div></div></div></section>' +
      '<section class="blk"><div class="wrap"><h2 class="sec-title"><small>abertas agora</small>vagas em destaque</h2>' + cards +
      (publicas().length > 3 ? '<p style="margin-top:28px"><a class="btn ghost" href="#/vagas">Ver todas as vagas</a></p>' : '') + '</div></section>' +
      '<section class="blk gridbg"><div class="wrap"><h2 class="sec-title"><small>veja como</small>funciona</h2><div class="steps">' +
      step('s1', 1, 'vaga divulgada', 'Toda vaga da LN aparece aqui e no Instagram, com um código.') +
      step('s2', 2, 'você se candidata', 'Envie o currículo por e-mail ou entre no banco de talentos.') +
      step('s3', 3, 'entrevista com a LN', 'A LN conversa com você sobre a vaga.') +
      step('s4', 4, 'contratação CLT', 'A carteira é assinada pela LN e você trabalha na empresa cliente.') + '</div></div></section>' +
      '<section class="blk"><div class="wrap"><div class="band" style="background:var(--accent);color:var(--on-accent)"><div><h2 style="color:var(--on-accent)">Monte seu currículo grátis, com dicas em cada etapa.</h2><p>Preencha pelo celular, receba sugestões enquanto escreve e baixe o PDF pronto. Sem cadastro.</p></div><div class="btns"><a class="btn primary" href="/curriculo/" style="background:var(--profundo);color:#fff;border-color:var(--profundo)">Criar meu currículo</a></div></div></div></section>' +
      '<section class="blk"><div class="wrap"><div class="band folha"><div><h2>Vaga falsa existe! Confirme antes de enviar qualquer dado.</h2><p>Digite o código que aparece no anúncio e veja se a vaga é da LN. Se não aparecer aqui, desconfie.</p></div><div class="btns"><a class="btn primary" href="#/verificar">Verificar uma vaga</a><a class="btn ghost" href="#/dicas">Ver sinais de golpe</a></div></div></div></section>' +
      '<section class="blk" style="padding-top:0"><div class="wrap"><div class="band lima"><div><h2>Não achou a vaga certa?</h2><p>Deixe seus dados e a LN chama você quando abrir uma vaga compatível com o seu perfil.</p></div><div class="btns"><a class="btn primary" href="#/talentos">Entrar no banco de talentos</a></div></div></div></section>';
  }
  function step(cls, n, h, t) { return '<div class="step ' + cls + '"><span class="tb">etapa ' + n + '</span><div class="bd"><h3>' + esc(h) + '</h3><p>' + esc(t) + '</p></div></div>'; }

  function pVagas() {
    var all = publicas();
    var f = ui.filterSeg, q = ui.q.toLowerCase();
    var qn = normCode(ui.q);
    var list = all.filter(function (v) { return (!f || v.segmento === f) && (!q || (v.titulo + ' ' + v.segmento + ' ' + v.codigo).toLowerCase().indexOf(q) >= 0 || (qn && normCode(v.codigo).indexOf(qn) >= 0)); });
    var chips = '<button class="chipf" data-a="seg" data-v="" aria-pressed="' + (!f) + '">Todos</button>' + SEGS.map(function (s) { return '<button class="chipf" data-a="seg" data-v="' + esc(s) + '" aria-pressed="' + (f === s) + '">' + esc(s) + '</button>'; }).join('');
    var body = list.length ? '<div class="vgrid">' + list.map(function (v) { return vagaCard(v); }).join('') + '</div>' : (all.length ? '<div class="empty"><h3>Nada com esse filtro</h3><p>Tente outro segmento ou limpe a busca.</p></div>' : emptyVagas());
    return '<section class="page-head gridbg"><div class="wrap"><h1 class="sec-title" style="margin:0"><small>todas as</small>vagas abertas</h1><p class="intro">Cada pasta é um segmento de empresa. A LN não publica salário nem local no anúncio: esses dados são passados no contato.</p></div></section>' +
      '<section class="blk" style="padding-top:32px"><div class="wrap"><div class="filters">' + chips + '<input class="search" type="search" placeholder="Buscar por nome ou código" aria-label="Buscar vaga" data-in="q" value="' + esc(ui.q) + '"></div>' + body + '</div></section>';
  }
  function list(items) { return '<ul class="checks">' + items.map(function (i) { return '<li>' + ic('check', 22, '#0E4937') + '<span>' + esc(i) + '</span></li>'; }).join('') + '</ul>'; }
  function pVaga(code) {
    var v = findVaga(code);
    if (!v || (v.status === 'rascunho' && !authed)) return notFound('Não encontramos essa vaga', 'Confira o código no anúncio ou use a página de verificação.');
    var subj = encodeURIComponent(v.codigo + ' · ' + v.titulo);

    var banner = v.status === 'encerrada' ? '<div class="banner warn">Esta vaga está encerrada. Entre no banco de talentos para ser chamado nas próximas.</div>' : (v.status === 'rascunho' ? '<div class="banner info">Rascunho: só você vê esta página. Publique a vaga no admin para ela aparecer no site.</div>' : '');
    var extra = '';
    if (cfg.showLocal && v.local) extra += '<div><h4>Local</h4><p>' + esc(v.local) + '</p></div>';
    if (cfg.showSalary && v.salario) extra += '<div><h4>Faixa salarial</h4><p>' + esc(v.salario) + '</p></div>';
    return '<section class="page-head gridbg jobpage"><div class="wrap"><a class="back" href="#/vagas">' + ic('voltar', 20) + ' Todas as vagas</a>' + banner +
      '<span class="jobtab">' + esc(v.segmento) + '</span><div class="folderwrap"><div class="sheet"><h1>' + esc(v.titulo) + '</h1><div class="pills">' + vagaPills(v) + '</div>' +
      '<div class="cols2"><div><h4>O que você faz</h4>' + list(v.atividades || []) + '</div><div><h4>O que pedimos</h4>' + list(v.requisitos || []) + '</div>' +
      '<div><h4>Horários</h4>' + list(v.horarios || []) + '</div>' + extra + '</div>' +
      '<p class="muted" style="color:#5B6761">Código da vaga: <b>' + esc(v.codigo) + '</b> · <a href="#/verificar/' + esc(v.codigo) + '">verificar esta vaga</a> · publicada em ' + esc(fmtDate(v.criada)) + '</p></div></div>' +
      (v.status === 'encerrada' ? '' : '<div class="apply"><h2>quer se candidatar?</h2><p>Coloque o código <b>' + esc(v.codigo) + '</b> no assunto do e-mail.</p><div class="cta-row"><a class="btn primary" href="mailto:' + MAIL + '?subject=' + subj + '&body=' + body + '">' + ic('envelope', 20) + ' Enviar currículo por e-mail</a><a class="btn ghost" href="#/talentos">Entrar no banco de talentos</a></div><p style="font-size:15px;color:#D9DED9">A LN não pede documentos nem dados bancários nesta etapa.</p></div>') +
      '</div></section>';
  }
  function notFound(t, d) { return '<section class="blk gridbg" style="min-height:62vh;display:flex;align-items:center"><div class="wrap"><div class="empty"><div style="font-family:var(--font-display);font-weight:800;font-size:clamp(90px,18vw,160px);line-height:.9;color:var(--brand);letter-spacing:-.05em">404</div><h3 style="margin-top:12px">' + esc(t) + '</h3><p>' + esc(d) + '</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn primary" href="#/vagas">Ver vagas abertas</a><a class="btn ghost" href="#/">Ir para o início</a></div></div></div></section>'; }

  function pTalentos() {
    if (ui.flash === 'talento-ok') {
      ui.flash = null;
      return '<section class="page-head gridbg"><div class="wrap"><div class="band lima"><div><h2>Cadastro recebido.</h2><p>A LN guarda seus dados e chama você por e-mail ou telefone quando abrir uma vaga compatível. Neste protótipo, o cadastro fica só neste navegador.</p></div><div class="btns"><a class="btn primary" href="#/vagas">Ver vagas abertas</a><a class="btn ghost" href="#/dicas">Ver dicas de currículo</a></div></div></div></section>';
    }
    var areas = AREAS.map(function (a) { var outro = a === 'Outra área' ? ' data-outro="1"' : ''; return '<label><input type="checkbox" name="areas" value="' + esc(a) + '"' + outro + '> ' + esc(a) + '</label>'; }).join('');
    return '<section class="page-head gridbg"><div class="wrap"><h1 class="sec-title" style="margin:0"><small>não achou a vaga?</small>banco de talentos</h1><p class="intro">Deixe seus dados uma vez. Quando abrir uma vaga compatível, a LN entra em contato com você.</p></div></section>' +
      '<section class="blk" style="padding-top:24px"><div class="wrap twocol"><div><h2 class="sec-title" style="font-size:clamp(30px,4vw,44px)">como cuidamos dos seus dados</h2>' +
      '<ul class="list"><li>Usamos seus dados só para contato sobre vagas da LN.</li><li>Guardamos por até 12 meses e, depois disso, apagamos automaticamente. Você pode pedir a exclusão a qualquer momento pelo e-mail <a href="mailto:' + MAIL + '">' + MAIL + '</a>.</li><li>Seu currículo fica em área privada, com acesso restrito à equipe da LN.</li></ul>' +
      '<h3 style="margin:28px 0 8px;font-size:28px">o que a LN não pede</h3><ul class="notlist"><li>' + ic('x', 22, 'var(--signal-text)') + '<span>CPF, RG ou número de qualquer documento</span></li><li>' + ic('x', 22, 'var(--signal-text)') + '<span>Dados bancários, senhas ou pagamento</span></li><li>' + ic('x', 22, 'var(--signal-text)') + '<span>Foto, estado civil, idade ou informações de saúde</span></li></ul>' +
      '<p style="margin-top:20px"><button type="button" class="linklike" data-a="privacidade">Ler o aviso de privacidade completo</button></p></div>' +
      '<div class="card"><form class="form" data-form="talento" novalidate>' +
      '<div class="field"><label for="t-nome">Nome completo</label><input id="t-nome" name="nome" type="text" autocomplete="name" required><span class="err" data-err="nome"></span></div>' +

      '<details class="acc"><summary>perguntas frequentes</summary><div class="in">' +
      '<h4>Vou trabalhar com carteira assinada?</h4><p>Sim. A contratação é CLT e quem assina a carteira é a LN.</p><h4>Quem é meu empregador?</h4><p>A LN. Ela é uma empresa de terceirização: contrata você e você presta serviço dentro da empresa cliente, no dia a dia dela. Salário, férias, 13º e FGTS são pagos pela LN.</p>' +

      '<details class="acc"><summary>direitos do trabalhador</summary><div class="in"><h4>13º salário</h4><p>Quem trabalha em regime CLT tem direito ao 13º salário, pago em duas parcelas: a primeira até 30 de novembro, sem desconto; a segunda até 20 de dezembro, já com os descontos.</p><h4>Férias</h4><p>Após 12 meses de trabalho, você tem direito a 30 dias de férias remuneradas, com um adicional de um terço do salário.</p><h4>FGTS</h4><p>Todo mês, o empregador deposita 8% do seu salário numa conta vinculada ao FGTS, que você pode sacar em situações como demissão sem justa causa.</p><p class="muted" style="margin-top:4px">Fonte: CLT (art. 457, §1º), Lei 4.090/1962 e Lei 8.036/1990.</p></div></details>' +

    document.addEventListener('mousemove', function (e) {
      if (parallaxTicking) return; parallaxTicking = true;
      requestAnimationFrame(function () {
        parallaxTicking = false;
        var hero = document.querySelector('.hero'); if (!hero) return;
        var stack = hero.querySelector('.stack'); if (!stack) return;
        var r = hero.getBoundingClientRect();
        var mx = (e.clientX - r.left) / Math.max(r.width, 1) - 0.5, my = (e.clientY - r.top) / Math.max(r.height, 1) - 0.5;
        stack.style.transform = 'translate(' + (mx * 12).toFixed(1) + 'px,' + (my * 10).toFixed(1) + 'px)';
      });
    });
  }
  window.addEventListener('hashchange', function () { ui.confirm = null; if (location.hash.indexOf('#/admin/vaga/') !== 0 && location.hash.indexOf('#/admin/post/') !== 0) ui.vagaDraft = null; render(); });
  boot();
})();
</script>
